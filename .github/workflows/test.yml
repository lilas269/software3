name: Simple Check

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files exist
        run: |
          if [ -f "package.json" ]; then
            echo "✅ package.json exists"
          else
            echo "❌ package.json not found"
            exit 1
          fi
          echo "📦 All required files are present!"