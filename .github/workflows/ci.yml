on:
  push:
    branches:
      - main
      - lilas-task

  pull_request:
    branches:
      - main
      - lilas-task

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
        with:
          node-version: 18

      - run: npm install
      - run: npm test
